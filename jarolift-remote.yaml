substitutions:
  device_name: jarolift-remote

esphome:
  name: ${device_name}
  friendly_name: Jarolift Remote

esp32:
  board: esp32-poe
  framework:
    type: esp-idf

ethernet:
  type: LAN8720
  mdc_pin: GPIO23
  mdio_pin: GPIO18
  clk:
    pin: GPIO17
    mode: CLK_OUT
  phy_addr: 0
  power_pin: GPIO12

logger:
  level: DEBUG

ota:
  - platform: esphome
    password: !secret ota_password

safe_mode:
  num_attempts: 10

# Rolling counters, settings and certificates are committed to NVS immediately by the jarolift
# component. This interval batches cover positions and travel times; 10 s keeps a power cut from
# restoring an older position while limiting flash writes during travel.
preferences:
  flash_write_interval: 10s

packages:
  ch0: !include {file: packages/channel.yaml, vars: {channel: 0}}
  ch1: !include {file: packages/channel.yaml, vars: {channel: 1}}
  ch2: !include {file: packages/channel.yaml, vars: {channel: 2}}
  ch3: !include {file: packages/channel.yaml, vars: {channel: 3}}
  ch4: !include {file: packages/channel.yaml, vars: {channel: 4}}
  ch5: !include {file: packages/channel.yaml, vars: {channel: 5}}
  ch6: !include {file: packages/channel.yaml, vars: {channel: 6}}
  ch7: !include {file: packages/channel.yaml, vars: {channel: 7}}
  ch8: !include {file: packages/channel.yaml, vars: {channel: 8}}
  ch9: !include {file: packages/channel.yaml, vars: {channel: 9}}
  ch10: !include {file: packages/channel.yaml, vars: {channel: 10}}
  ch11: !include {file: packages/channel.yaml, vars: {channel: 11}}
  ch12: !include {file: packages/channel.yaml, vars: {channel: 12}}
  ch13: !include {file: packages/channel.yaml, vars: {channel: 13}}
  ch14: !include {file: packages/channel.yaml, vars: {channel: 14}}
  ch15: !include {file: packages/channel.yaml, vars: {channel: 15}}

external_components:
  - source:
      type: local
      path: components

jarolift:
  id: jarolift_hub
  master_msb: !secret jarolift_master_msb
  master_lsb: !secret jarolift_master_lsb
  serial_prefix: !secret jarolift_serial_prefix
  learn_mode_new: !secret jarolift_learn_mode_new
  web:
    username: !secret web_username
    password: !secret web_password
  mqtt:
    broker_url: !secret mqtt_broker_url
    username: !secret mqtt_username
    password: !secret mqtt_password
  # One cover and two travel-time numbers per channel (packages/channel.yaml).
  slots:
    - {channel: 0, cover: ch0_cover, open_duration: ch0_open_duration, close_duration: ch0_close_duration}
    - {channel: 1, cover: ch1_cover, open_duration: ch1_open_duration, close_duration: ch1_close_duration}
    - {channel: 2, cover: ch2_cover, open_duration: ch2_open_duration, close_duration: ch2_close_duration}
    - {channel: 3, cover: ch3_cover, open_duration: ch3_open_duration, close_duration: ch3_close_duration}
    - {channel: 4, cover: ch4_cover, open_duration: ch4_open_duration, close_duration: ch4_close_duration}
    - {channel: 5, cover: ch5_cover, open_duration: ch5_open_duration, close_duration: ch5_close_duration}
    - {channel: 6, cover: ch6_cover, open_duration: ch6_open_duration, close_duration: ch6_close_duration}
    - {channel: 7, cover: ch7_cover, open_duration: ch7_open_duration, close_duration: ch7_close_duration}
    - {channel: 8, cover: ch8_cover, open_duration: ch8_open_duration, close_duration: ch8_close_duration}
    - {channel: 9, cover: ch9_cover, open_duration: ch9_open_duration, close_duration: ch9_close_duration}
    - {channel: 10, cover: ch10_cover, open_duration: ch10_open_duration, close_duration: ch10_close_duration}
    - {channel: 11, cover: ch11_cover, open_duration: ch11_open_duration, close_duration: ch11_close_duration}
    - {channel: 12, cover: ch12_cover, open_duration: ch12_open_duration, close_duration: ch12_close_duration}
    - {channel: 13, cover: ch13_cover, open_duration: ch13_open_duration, close_duration: ch13_close_duration}
    - {channel: 14, cover: ch14_cover, open_duration: ch14_open_duration, close_duration: ch14_close_duration}
    - {channel: 15, cover: ch15_cover, open_duration: ch15_open_duration, close_duration: ch15_close_duration}
  # Initial channel layout (docs: design.md channel table); editable in the web interface.
  shutters:
    - {name: kueche, channel: 0}
    - {name: terrasse, channel: 1}
    - {name: wohnzimmer-links, channel: 2}
    - {name: wohnzimmer-rechts, channel: 3}
    - {name: kind3-balkontuer, channel: 4}
    - {name: kind3-fenster, channel: 5}
    - {name: kind4-fenster, channel: 6}
    - {name: eltern-links, channel: 7}
    - {name: eltern-rechts, channel: 8}
  groups:
    - {name: alle, members: [kueche, terrasse, wohnzimmer-links, wohnzimmer-rechts, kind3-balkontuer, kind3-fenster, kind4-fenster, eltern-links, eltern-rechts]}
    - {name: eg, members: [kueche, terrasse, wohnzimmer-links, wohnzimmer-rechts]}
    - {name: og, members: [kind3-balkontuer, kind3-fenster, kind4-fenster, eltern-links, eltern-rechts]}
    - {name: og-eltern, members: [eltern-links, eltern-rechts]}
    - {name: og-kinder, members: [kind3-balkontuer, kind3-fenster, kind4-fenster]}
