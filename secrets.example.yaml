# Template for secrets.yaml. The real values live SOPS-encrypted in secrets.enc.yaml:
#   sops -d secrets.enc.yaml > secrets.yaml
# All values are build-time defaults; the web interface can override them at runtime.

# Jarolift identity, migrated from the old dongle (docs/migration.md)
jarolift_master_msb: "0x00000000"
jarolift_master_lsb: "0x00000000"
jarolift_serial_prefix: "0x000000"
jarolift_learn_mode_new: "true"

ota_password: "change-me"
web_username: "admin"
web_password: "change-me"

# Broker as URL: [mqtt|mqtts|ws|wss://]<host>[:<port>][/<path>], empty = disabled
mqtt_broker_url: "mqtt://192.0.2.10:1883"
mqtt_username: ""
mqtt_password: ""
